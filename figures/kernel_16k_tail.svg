<svg xmlns="http://www.w3.org/2000/svg" width="960" height="455" viewBox="0 0 960 455" role="img" aria-labelledby="title">
<title id="title">16K: keep the crossing load; remove unused handshakes</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#607184"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#273342">
<text x="28" y="34" font-size="22" fill="#273342" font-weight="600" text-anchor="start">16K: keep the crossing load; remove unused handshakes</text>
<text x="28" y="72" font-size="17" fill="#273342" font-weight="400" text-anchor="start">Final outer K iteration: 256 live values out of 768</text>
<text x="28" y="126" font-size="16" fill="#273342" font-weight="600" text-anchor="start">A/B loads</text>
<rect x="168.0" y="98" width="245.0" height="46" rx="5" fill="#dce9f5" stroke="#c3cbd4" stroke-width="1"/>
<text x="290.5" y="126.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">Slice 0: live</text>
<rect x="416.0" y="98" width="245.0" height="46" rx="5" fill="#fae9d5" stroke="#c3cbd4" stroke-width="1"/>
<text x="538.5" y="126.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">Slice 1: keep zero fill</text>
<rect x="664.0" y="98" width="245.0" height="46" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="786.5" y="126.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">Slice 2: remove</text>
<text x="28" y="189" font-size="16" fill="#273342" font-weight="600" text-anchor="start">Scale loads</text>
<rect x="168.0" y="161" width="183.0" height="46" rx="5" fill="#dceee8" stroke="#c3cbd4" stroke-width="1"/>
<text x="259.5" y="189.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">SF 0: keep</text>
<rect x="354.0" y="161" width="183.0" height="46" rx="5" fill="#dceee8" stroke="#c3cbd4" stroke-width="1"/>
<text x="445.5" y="189.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">SF 1: keep</text>
<rect x="540.0" y="161" width="183.0" height="46" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="631.5" y="189.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">SF 2: remove</text>
<rect x="726.0" y="161" width="183.0" height="46" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="817.5" y="189.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">SF 3: remove</text>
<rect x="168.0" y="224" width="90.0" height="44" rx="5" fill="#e8dff2" stroke="#c3cbd4" stroke-width="1"/>
<text x="213.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 0</text>
<rect x="261.0" y="224" width="90.0" height="44" rx="5" fill="#e8dff2" stroke="#c3cbd4" stroke-width="1"/>
<text x="306.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 1</text>
<rect x="354.0" y="224" width="90.0" height="44" rx="5" fill="#e8dff2" stroke="#c3cbd4" stroke-width="1"/>
<text x="399.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 2</text>
<rect x="447.0" y="224" width="90.0" height="44" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="492.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 3</text>
<rect x="540.0" y="224" width="90.0" height="44" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="585.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 4</text>
<rect x="633.0" y="224" width="90.0" height="44" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="678.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 5</text>
<rect x="726.0" y="224" width="90.0" height="44" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="771.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 6</text>
<rect x="819.0" y="224" width="90.0" height="44" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="864.0" y="251.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">MMA 7</text>
<text x="28" y="251" font-size="16" fill="#273342" font-weight="600" text-anchor="start">MMA issue</text>
<text x="168.0" y="299" font-size="13" fill="#5d6977" font-weight="400" text-anchor="middle">0</text>
<text x="354.0" y="299" font-size="13" fill="#5d6977" font-weight="400" text-anchor="middle">192</text>
<text x="416.0" y="299" font-size="13" fill="#5d6977" font-weight="400" text-anchor="middle">256</text>
<text x="540.0" y="299" font-size="13" fill="#5d6977" font-weight="400" text-anchor="middle">384</text>
<text x="664.0" y="299" font-size="13" fill="#5d6977" font-weight="400" text-anchor="middle">512</text>
<text x="912.0" y="299" font-size="13" fill="#5d6977" font-weight="400" text-anchor="middle">768</text>
<text x="28" y="299" font-size="15" fill="#5d6977" font-weight="400" text-anchor="start">K offset</text>
<text x="28" y="340" font-size="17" fill="#273342" font-weight="400" text-anchor="start">MMA 2 reads [192, 288): 64 live values + 32 zeros from A/B slice 1.</text>
<text x="28" y="372" font-size="17" fill="#273342" font-weight="400" text-anchor="start">Before: 3 A/B + 4 SF handshakes.  After: 2 A/B + 2 SF handshakes.</text>
<text x="28" y="404" font-size="16" fill="#273342" font-weight="400" text-anchor="start">Both versions issue only MMAs 0–2. The savings are in loads, waits and releases.</text>
<text x="28" y="435" font-size="15" fill="#5d6977" font-weight="400" text-anchor="start">Slice ranges are logical K values; packed byte offsets are half these values.</text>
</g>
</svg>
