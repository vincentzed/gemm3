<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" aria-labelledby="title">
<title id="title">32K store pairing: emit adjacent row segments together</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#607184"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#273342">
<text x="28" y="34" font-size="22" fill="#273342" font-weight="600" text-anchor="start">32K store pairing: emit adjacent row segments together</text>
<text x="28" y="77" font-size="17" fill="#273342" font-weight="600" text-anchor="start">Unpaired</text>
<rect x="170" y="54" width="155" height="56" rx="5" fill="#dce9f5" stroke="#c3cbd4" stroke-width="1"/>
<text x="247.5" y="87.0" font-size="16" fill="#273342" font-weight="400" text-anchor="middle">Convert half 0</text>
<path d="M332,82 L358,82" fill="none" stroke="#607184" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="365" y="54" width="165" height="56" rx="5" fill="#e8dff2" stroke="#c3cbd4" stroke-width="1"/>
<text x="447.5" y="87.0" font-size="16" fill="#273342" font-weight="400" text-anchor="middle">2 × 32 B stores</text>
<path d="M537,82 L563,82" fill="none" stroke="#607184" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="570" y="54" width="160" height="56" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="650.0" y="87.0" font-size="16" fill="#273342" font-weight="400" text-anchor="middle">Convert half 1</text>
<path d="M737,82 L763,82" fill="none" stroke="#607184" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="770" y="54" width="165" height="56" rx="5" fill="#e8dff2" stroke="#c3cbd4" stroke-width="1"/>
<text x="852.5" y="87.0" font-size="16" fill="#273342" font-weight="400" text-anchor="middle">2 × 32 B stores</text>
<text x="28" y="170" font-size="17" fill="#273342" font-weight="600" text-anchor="start">Paired</text>
<rect x="170" y="142" width="210" height="64" rx="5" fill="#fae9d5" stroke="#c3cbd4" stroke-width="1"/>
<text x="275.0" y="168.0" font-size="15" fill="#273342" font-weight="400" text-anchor="middle">Convert half 0</text>
<text x="275.0" y="190.0" font-size="15" fill="#273342" font-weight="400" text-anchor="middle">Hold 64 B in registers</text>
<path d="M387,174 L415,174" fill="none" stroke="#607184" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="423" y="142" width="192" height="64" rx="5" fill="#edf0f3" stroke="#c3cbd4" stroke-width="1"/>
<text x="519.0" y="179.0" font-size="14" fill="#273342" font-weight="400" text-anchor="middle">Convert half 1</text>
<path d="M622,174 L650,174" fill="none" stroke="#607184" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="658" y="142" width="277" height="64" rx="5" fill="#e8dff2" stroke="#c3cbd4" stroke-width="1"/>
<text x="796.5" y="168.0" font-size="15" fill="#273342" font-weight="400" text-anchor="middle">Half 0 stores → half 1 stores</text>
<text x="796.5" y="190.0" font-size="15" fill="#273342" font-weight="400" text-anchor="middle">4 × 32 B, back to back</text>
<rect x="170" y="246" width="310" height="44" rx="5" fill="#dce9f5" stroke="#c3cbd4" stroke-width="1"/>
<text x="325.0" y="273.0" font-size="16" fill="#273342" font-weight="400" text-anchor="middle">64 B half 0</text>
<rect x="483" y="246" width="310" height="44" rx="5" fill="#dceee8" stroke="#c3cbd4" stroke-width="1"/>
<text x="638.0" y="273.0" font-size="16" fill="#273342" font-weight="400" text-anchor="middle">64 B half 1</text>
<text x="807" y="274" font-size="15" fill="#273342" font-weight="400" text-anchor="start">128 B line</text>
<text x="170" y="324" font-size="16" fill="#273342" font-weight="400" text-anchor="start">Same bytes and store count. Shorter gap between writes to the same line.</text>
<text x="170" y="356" font-size="15" fill="#5d6977" font-weight="400" text-anchor="start">Traversal may reverse: half 1 then half 0 still forms the same adjacent pair.</text>
</g>
</svg>
