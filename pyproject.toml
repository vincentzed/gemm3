[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nvfp4-gemm-cute"
dynamic = ["version"]
requires-python = ">=3.10"
description = "GEMM³: NVFP4 GEMM for B300 / GB300 in CuTe DSL"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "nvidia-cutlass-dsl>=4.8",
    "torch",
    "apache-tvm-ffi>=0.1.6,<0.2",
]

[project.urls]
Repository = "https://github.com/vincentzed/gemm3"
Documentation = "https://github.com/vincentzed/gemm3/blob/main/docs/usage.md"

[project.optional-dependencies]
cu13 = ["nvidia-cutlass-dsl[cu13]>=4.8"]
bench = ["flashinfer-python", "cupti-python>=13"]
dev = [
    "build",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nvfp4_gemm_cute*"]

[tool.setuptools.dynamic]
version = {attr = "nvfp4_gemm_cute.__version__"}

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "extra == 'cu13'" },
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -p no:unraisableexception -p no:threadexception"

[tool.ruff]
line-length = 100
exclude = [".#*"]

[tool.ruff.lint]
extend-select = ["B904"]
ignore = [
    "E731",
    "E741",
    "F841",
]
